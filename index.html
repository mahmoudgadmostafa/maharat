
<!doctype html>
<html lang="ar" dir="rtl">
  <head>
<meta name="google-site-verification" content="zhGQHNFWfOITDhmI4eUm75zGn8x_qnWosu8JGNTZt3g" />
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.png" type="image/png">
    <meta name="generator" content="Hostinger Horizons" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- تحسين الأداء -->
    <link rel="preconnect" href="https://storage.googleapis.com">
    <meta name="theme-color" content="#8B5CF6">
    <meta name="description" content="منصة مهارات التعليمية - تجربة تعليمية متكاملة مدعومة بالذكاء الاصطناعي">
    
    <title>منصة مهارات التعليمية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    
    <!-- شاشة تحميل أولية -->
    <style>
      #initial-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #f3e8ff 0%, #dbeafe 50%, #e0e7ff 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        font-family: 'Cairo', sans-serif;
      }
      
      .loader-spinner {
        width: 50px;
        height: 50px;
        border: 4px solid #e5e7eb;
        border-top: 4px solid #8b5cf6;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      .loader-text {
        color: #6b7280;
        font-size: 16px;
        font-weight: 600;
      }
      
      .fade-out {
        opacity: 0;
        transition: opacity 0.5s ease-out;
      }
    </style>
  </head>
  <body>
    <!-- شاشة التحميل الأولية -->
    <div id="initial-loader">
      <div class="loader-spinner"></div>
      <div class="loader-text">جاري تحميل منصة مهارات التعليمية...</div>
    </div>
    
    <div id="root"></div>
    
    <script>
      // إخفاء شاشة التحميل عند اكتمال تحميل الصفحة
      window.addEventListener('load', function() {
        setTimeout(function() {
          const loader = document.getElementById('initial-loader');
          if (loader) {
            loader.classList.add('fade-out');
            setTimeout(function() {
              loader.style.display = 'none';
            }, 500);
          }
        }, 1000);
      });
    </script>
    
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
